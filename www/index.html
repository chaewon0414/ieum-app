<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfbf8" />
    <title>이음 | 청년 생활 지원</title>
    <meta name="description" content="청년의 주거, 금융, 취업과 정책을 한곳에서 연결하는 생활 지원 앱" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@20..48,400,0..1&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/styles.css" />
    <script>
      if (document.fonts) {
        document.fonts.load('20px "Material Symbols Rounded"').then(() => {
          document.documentElement.classList.add("icons-ready");
        });
      } else {
        document.documentElement.classList.add("icons-ready");
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" data-route="home" aria-label="홈으로 이동">
          <span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 19.5c3.5-7 7.5-7 11-3.5s7.5 3.5 11-3.5" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><circle cx="5" cy="19.5" r="3" fill="currentColor"/><circle cx="27" cy="12.5" r="3" fill="currentColor"/></svg></span>
          <span>이음</span>
        </button>
        <div class="topbar-actions" hidden>
          <button class="icon-button" data-route="notifications" aria-label="알림"><span class="material-symbols-rounded">notifications</span><i hidden></i></button>
          <button class="avatar" data-route="profile" aria-label="내 정보"><span>지</span></button>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="주요 메뉴">
        <button data-route="home"><span class="material-symbols-rounded">home</span><small>홈</small></button>
        <button data-route="policies"><span class="material-symbols-rounded">policy</span><small>지원정책</small></button>
        <button data-route="community"><span class="material-symbols-rounded">forum</span><small>커뮤니티</small></button>
        <button data-route="profile"><span class="material-symbols-rounded">person</span><small>내 정보</small></button>
      </nav>
      <button id="context-action" class="context-action" type="button" aria-label="AI 상담 열기">
        <span class="material-symbols-rounded">smart_toy</span>
      </button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.bundle.js"></script>
  </body>
</html>
